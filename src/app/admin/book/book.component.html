<h4 class="text-center mt-4">Danh sách sản phẩm sách</h4>
<button type="button" class="btn btn-outline-primary float-end" routerLink="create">Thêm sách</button>
<div class="table-reponsive">
  <div class="input-group w-auto" style="max-width: 300px;">
    <input type="search" class="form-control rounded" placeholder="Search" aria-label="Search"
      aria-describedby="search-addon" [(ngModel)]="txtSearch"/>
    <button type="button" class="btn btn-outline-primary" (click)="handleSearch()">Tìm</button>
  </div>
  <div class="row mb-3 mt-1">
  <!-- <div class="col-md-3">
    <label>Trạng thái</label>
    <select title='status' [(ngModel)]="filterStatus" (ngModelChange)="handleChange()" class="form-select">
      <option [ngValue]="null">Tất cả</option>
      <option [ngValue]="true">Còn hàng</option>
      <option [ngValue]="false">Hết hàng</option>
    </select>
  </div> -->

  <div class="col-md-3">
    <label>Giá từ</label>
    <input type="number" [(ngModel)]="minPrice" class="form-control" (ngModelChange)="handleChange()" placeholder="Tối thiểu">
  </div>

  <div class="col-md-3">
    <label>Đến</label>
    <input type="number" [(ngModel)]="maxPrice" class="form-control" (ngModelChange)="handleChange()" placeholder="Tối đa">
  </div>
</div>
  <table class="table align-middle table-striped mb-0 bg-white">
  <thead class="bg-light" class="datatable">
    <tr>
      <th>Hình ảnh</th>
      <th>Tên</th>
      <th>Số lượng</th>
      <th>Giá</th>
      <th>Trạng thái</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody >
    <tr *ngFor="let book of books">
      <td>
        <ng-template [ngIf]="book.imageBase64" [ngIfElse]="second"> <img [src]="book.imageBase64" alt="Ảnh"
            class="rounded-circle" style="width: 45px; height: 45px; object-fit: cover;" /> </ng-template>
        <ng-template #second>
              <img [src]="book.link" alt="" class="rounded-circle" style="width: 45px; height: 45px; object-fit: cover;" >
        </ng-template>
     
      </td>
      <td>
        <p class="fw-normal mb-1">{{book.title}}</p>
      </td>
      <td>
        <p>{{book.stock}}</p>
      </td>
      <td>{{book.price | currency: 'VND'}}</td>
       <td>
        <span class="badge rounded-pill d-inline" [ngClass]="book.status ? 'bg-success' : 'bg-danger'">
          <i class="fas" [ngClass]="book.status ? 'fa-check-circle' : 'fa-times-circle'"></i>
          {{ book.status ? 'Còn hàng' : 'Hết hàng' }}
        </span>
      </td>
      <td class="">
        <a class="btn btn-warning me-2" [routerLink]="['update', book.bookid]"><i class="fas fa-edit"></i> Sửa</a>
        <button type="button" class="btn btn-danger" (click)="deleteBook(book.bookid)"> <i class="fas fa-trash-alt"></i> Xóa</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
<nav class="float-end mt-2" aria-label="...">
  <ul class="pagination mt-3">
  <li class="page-item" [class.disabled]="currentPage === 1">
    <a href="#" class="page-link" (click)="setPage(currentPage - 1); $event.preventDefault()">Previous</a>
  </li>

  <li class="page-item" [class.disabled]="isLastPage">
    <a href="#" class="page-link" (click)="setPage(currentPage + 1); $event.preventDefault()">Next</a>
  </li>
</ul>
</nav>
