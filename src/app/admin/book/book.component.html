<h4 class="text-center mt-4">Danh sách sản phẩm sách</h4>
<button type="button" class="btn btn-outline-primary float-end" routerLink="create">Thêm sách</button>
<div class="table-reponsive">
  <div class="input-group w-auto" style="max-width: 300px;">
    <input type="search" class="form-control rounded" placeholder="Search" aria-label="Search"
      aria-describedby="search-addon" />
    <button type="button" class="btn btn-outline-primary">Tìm</button>
  </div>
  <div class="row mb-3 mt-1">
  <div class="col-md-3">
    <label>Trạng thái</label>
    <select title='s' [(ngModel)]="filterStatus" class="form-select">
      <option [ngValue]="null">Tất cả</option>
      <option [ngValue]="true">Còn hàng</option>
      <option [ngValue]="false">Hết hàng</option>
    </select>
  </div>

  <div class="col-md-3">
    <label>Giá từ</label>
    <input type="number" [(ngModel)]="minPrice" class="form-control" placeholder="Tối thiểu">
  </div>

  <div class="col-md-3">
    <label>Đến</label>
    <input type="number" [(ngModel)]="maxPrice" class="form-control" placeholder="Tối đa">
  </div>
</div>
  <table class="table align-middle table-striped mb-0 bg-white">
  <thead class="bg-light" class="datatable">
    <tr>
      <th>Hình ảnh</th>
      <th>Tên</th>
      <th>Số lượng</th>
      <th>Giá</th>
      <th>Trạng thái</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody >
    <tr *ngFor="let book of filteredBooks()">
      <td>
      <img [src]="book.imageBase64" alt="Ảnh" class="rounded-circle"
     style="width: 45px; height: 45px; object-fit: cover;" />
      </td>
      <td>
        <p class="fw-normal mb-1">{{book.title}}</p>
      </td>
      <td>
        <p>{{book.stock}}</p>
      </td>
      <td>{{book.price | currency: 'VND'}}</td>
       <td>
        <span class="badge rounded-pill d-inline" [ngClass]="book.status ? 'bg-success' : 'bg-danger'">
          <i class="fas" [ngClass]="book.status ? 'fa-check-circle' : 'fa-times-circle'"></i>
          {{ book.status ? 'Còn hàng' : 'Hết hàng' }}
        </span>
      </td>
      <td class="">
        <button type="button" class="btn btn-warning me-2"><i class="fas fa-edit"></i> Sửa</button>
        <button type="button" class="btn btn-danger"> <i class="fas fa-trash-alt"></i> Xóa</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
<nav class="float-end mt-2" aria-label="...">
  <ul class="pagination">
    <li class="page-item disabled">
      <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
    </li>
    <li class="page-item active"><a class="page-link" href="#">1</a></li>
    <li class="page-item" aria-current="page">
      <a class="page-link" href="#">2</a>
    </li>
    <li class="page-item"><a class="page-link" href="#">3</a></li>
    <li class="page-item">
      <a class="page-link" href="#">Next</a>
    </li>
  </ul>
</nav>
