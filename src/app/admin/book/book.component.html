<!-- Danh sách sách cải thiện -->
<div class="container-fluid py-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h2 fw-bold mb-1">📚 Danh sách sách</h1>
      <p class="text-muted small">Quản lý kho sách của bạn</p>
    </div>
    <button type="button" class="btn btn-primary btn-lg" routerLink="create">
      <i class="fas fa-plus me-2"></i>Thêm sách mới
    </button>
  </div>

  <!-- Search & Filter Section -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
      <div class="row g-3 mb-3">
        <!-- Search Bar -->
        <div class="col-md-6">
          <label class="form-label fw-semibold small text-uppercase">Tìm kiếm sách</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="fas fa-search text-muted"></i>
            </span>
            <input 
              type="search" 
              class="form-control border-start-0" 
              placeholder="Nhập tên sách..." 
              [(ngModel)]="txtSearch"
              (keyup.enter)="handleSearch()">
            <button type="button" class="btn btn-primary" (click)="handleSearch()">
              Tìm
            </button>
          </div>
        </div>

        <!-- Price Range Filter -->
        <div class="col-md-3">
          <label class="form-label fw-semibold small text-uppercase">Giá từ</label>
          <input 
            type="number" 
            [(ngModel)]="minPrice" 
            class="form-control" 
            (ngModelChange)="handleChange()" 
            placeholder="Tối thiểu">
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold small text-uppercase">Đến</label>
          <input 
            type="number" 
            [(ngModel)]="maxPrice" 
            class="form-control" 
            (ngModelChange)="handleChange()" 
            placeholder="Tối đa">
        </div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light border-bottom">
          <tr>
            <th class="fw-semibold text-muted small text-uppercase">Hình ảnh</th>
            <th class="fw-semibold text-muted small text-uppercase">Tên sách</th>
            <th class="fw-semibold text-muted small text-uppercase">Số lượng</th>
            <th class="fw-semibold text-muted small text-uppercase">Giá</th>
            <th class="fw-semibold text-muted small text-uppercase">Trạng thái</th>
            <th class="fw-semibold text-muted small text-uppercase">Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let book of books" class="border-bottom">
            <!-- Image -->
            <td>
              <ng-template [ngIf]="book.imageBase64" [ngIfElse]="second">
                <img 
                  [src]="book.imageBase64" 
                  alt="Ảnh sách"
                  class="rounded" 
                  style="width: 50px; height: 65px; object-fit: cover;">
              </ng-template>
              <ng-template #second>
                <img 
                  [src]="book.link" 
                  alt="Ảnh sách"
                  class="rounded" 
                  style="width: 50px; height: 65px; object-fit: cover;">
              </ng-template>
            </td>

            <!-- Title -->
            <td>
              <p class="fw-semibold mb-0">{{ book.title }}</p>
            </td>

            <!-- Stock -->
            <td>
              <span class="badge bg-light text-dark">{{ book.stock }} cuốn</span>
            </td>

            <!-- Price -->
            <td>
              <p class="fw-bold text-primary mb-0">{{ book.price | currency: 'VND' }}</p>
            </td>

            <!-- Status -->
            <td>
              <span 
                class="badge rounded-pill" 
                [ngClass]="book.status ? 'bg-success' : 'bg-danger'">
                <i class="fas" [ngClass]="book.status ? 'fa-check-circle' : 'fa-times-circle'"></i>
                {{ book.status ? 'Còn hàng' : 'Hết hàng' }}
              </span>
            </td>

            <!-- Actions -->
            <td>
              <div class="btn-group btn-group-sm" role="group">
                <a 
                  class="btn btn-outline-warning" 
                  [routerLink]="['update', book.bookid]"
                  title="Sửa">
                  <i class="fas fa-edit"></i>
                </a>
                <button 
                  type="button" 
                  class="btn btn-outline-danger" 
                  (click)="deleteBook(book.bookid)"
                  title="Xóa">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination Section -->
  <nav class="d-flex justify-content-end mt-4" aria-label="Phân trang">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a 
          href="#" 
          class="page-link" 
          (click)="setPage(currentPage - 1); $event.preventDefault()">
          <i class="fas fa-chevron-left me-2"></i>Trước
        </a>
      </li>

      <li class="page-item active">
        <span class="page-link">
          Trang {{ currentPage }}
        </span>
      </li>

      <li class="page-item" [class.disabled]="isLastPage">
        <a 
          href="#" 
          class="page-link" 
          (click)="setPage(currentPage + 1); $event.preventDefault()">
          Sau<i class="fas fa-chevron-right ms-2"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
