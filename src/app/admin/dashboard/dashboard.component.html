<div class="row mt-4">
    <div class="col-md-3">
        <div class="card card-stats shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title text-muted">Người dùng</h6>
                        <h4 class="card-text">{{numberOfUsers}}</h4>
                    </div>
                    <i class="fas fa-users fa-2x text-primary"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stats shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title text-muted">Doanh thu</h6>
                        <h4 class="card-text">{{revenue | currency: 'VND'}}</h4>
                    </div>
                    <i class="fas fa-cash-register fa-2x text-success"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stats shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title text-muted">Đơn hàng</h6>
                        <h4 class="card-text">{{orders}}</h4>
                    </div>
                    <i class="fas fa-shopping-cart fa-2x text-warning"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stats shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title text-muted">Lượt truy cập</h6>
                        <h4 class="card-text">12,345</h4>
                    </div>
                    <i class="fas fa-chart-line fa-2x text-info"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart Section -->
<div class="row mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Biểu đồ doanh thu</h5>
                <canvas id="revenueChart" height="100"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Thống kê nhanh</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Đơn hàng hôm nay: 25</li>
                    <li class="list-group-item">Người dùng mới: 10</li>
                    <li class="list-group-item">Sản phẩm bán chạy: Sản phẩm A</li>
                </ul>
            </div>
        </div>
    </div>
</div>
