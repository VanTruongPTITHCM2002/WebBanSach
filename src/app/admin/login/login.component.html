<section class="login-section">
  <div class="container-fluid">
    <div class="row h-100 d-flex justify-content-center align-items-center">
      <!-- Left side - Branding -->
      <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-brand">
        <div class="brand-content text-center">
          <div class="brand-icon mb-4">
            <i class="fas fa-book-reader fa-5x"></i>
          </div>
          <h1 class="brand-title mb-3">Quản Lý Sách</h1>
          <p class="brand-subtitle">Hệ thống quản lý thư viện hiện đại và hiệu quả</p>
          <p class="brand-description mt-4">Quản lý tài liệu và sách dễ dàng với giao diện trực quan</p>
        </div>
      </div>

      <!-- Right side - Login Form -->
      <div class="col-md-10 col-lg-7 col-xl-6">
        <div class="login-card">
          <div class="login-header mb-5">
            <h2 class="fw-bold text-center">Đăng nhập</h2>
            <!-- <p class="text-center text-muted small mt-2">Trang quản lý bán sách</p> -->
          </div>

          <form #formLogin="ngForm" (ngSubmit)="onSubmit(formLogin)" novalidate>
            <!-- Username input -->
            <div class="form-group mb-4">
              <label class="form-label fw-500"
              [ngClass]="username.invalid && username.touched ? 'text-danger' : ''"
              for="username">Tên đăng nhập
                <span class="text-danger">*</span>
              </label>
              <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input 
                  type="text" 
                  name="username" 
                  id="username" 
                  ngModel 
                  #username="ngModel" 
                  class="form-control form-control-lg"
                  placeholder="Nhập tên tài khoản..."
                  [ngClass]="username.invalid && username.touched ? 'border border-danger bg-opacity-10' :''"
                  required />
              </div>
              <div *ngIf="username.invalid && username.touched" class="invalid-feedback d-block mt-2">
                <i class="fas fa-exclamation-circle me-1"></i>Vui lòng nhập tên tài khoản
              </div>
            </div>

            <!-- Password input -->
            <div class="form-group mb-5">
              <label class="form-label fw-500"
                [ngClass]="password.invalid && password.touched ? 'text-danger' : ''"
               for="password">
               Mật khẩu
              <span class="text-danger">*</span>
              </label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input 
                  type="password" 
                  name="password" 
                  id="password" 
                  ngModel 
                  #password="ngModel" 
                  class="form-control form-control-lg"
                  [ngClass]="password.invalid && password.touched ? 'border border-danger bg-opacity-10' : ''"
                  placeholder="Nhập mật khẩu..."
                  required />
              </div>
              <div *ngIf="password.invalid && password.touched" class="invalid-feedback d-block mt-2">
                <i class="fas fa-exclamation-circle me-1"></i>Vui lòng nhập mật khẩu
              </div>
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              class="btn btn-login btn-lg w-100 fw-600 mb-3">
              <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
            </button>

            <!-- Remember me -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember"  ngModel 
                  #rememberMe="ngModel" name="rememberMe"/>
              <label class="form-check-label" for="remember">
                Ghi nhớ tôi
              </label>
            </div>

            <!-- Footer link -->
            <p class="text-center text-muted small">
              Liên hệ quản trị viên nếu bạn quên mật khẩu
            </p>
          </form>
        </div>

        <!-- Footer -->
        <div class="login-footer mt-4 text-center text-muted small">
          <p>© 2025 Hệ thống quản lý sách. Bản quyền được bảo vệ.</p>
        </div>
      </div>
    </div>
  </div>
</section>
