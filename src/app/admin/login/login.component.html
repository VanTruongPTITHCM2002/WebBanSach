<section class="vh-100">
  <div class="container-fluid h-custom">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
          class="img-fluid" alt="Sample image">
      </div>
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        <form #formLogin="ngForm" (ngSubmit)="onSubmit(formLogin)" novalidate>
       
          <div class="divider d-flex align-items-center my-4">
            <h3 class="text-center fw-bold mx-3 mb-0">Đăng nhập trang quản lý</h3>
          </div>

          <!-- Email input -->
          <div data-mdb-input-init class="form-outline mb-4"> 
            <label class="form-label" for="form3Example3">Tên đăng nhập</label>
            <input type="text" name="username" id="form3Example3" ngModel #username="ngModel" class="form-control"
              placeholder="Nhập tên tài khoản..."  required/>
                <div *ngIf="username.invalid && username.touched" class="text-danger">
                  Vui lòng nhập tên tài khoản
                </div>
          </div>

          <!-- Password input -->
          <div data-mdb-input-init class="form-outline mb-3"> 
            <label class="form-label" for="form3Example4">Mật khẩu</label>
            <input  type="password" name="password" id="form3Example4" ngModel #password="ngModel" class="form-control "
              placeholder="Nhập mật khẩu..." required/>
            <div *ngIf="password.invalid && password.touched" class="text-danger">
              Vui lòng nhập mật khẩu
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <!-- Checkbox -->
            <div class="form-check mb-0">
              <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
              <label class="form-check-label" for="form2Example3">
                Remember me
              </label>
            </div>
            <a href="#!" class="text-body">Quên mật khẩu?</a>
          </div>

          <div class="text-center  mt-4  pt-2">
            <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg"
              style="padding-left: 2.5rem; padding-right: 2.5rem;">Đăng nhập</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</section>
