<h4 class="text-center mt-4">Danh sách nhà xuất bản</h4>
<button type="button" class="btn btn-outline-primary float-end" data-bs-toggle="modal" data-bs-target="#myModal">Thêm nhà xuất bản</button>
<div class="table-reponsive">
  <div class="input-group w-auto" style="max-width: 300px;">
    <input type="search" class="form-control rounded" placeholder="Search" aria-label="Search"
      aria-describedby="search-addon" [(ngModel)]="txtSearch"/>
    <button type="button" class="btn btn-outline-primary" (click)="handleSearch()">Tìm</button>
  </div>
  <table class="table align-middle table-striped mb-0 bg-white">
    <thead class="bg-light" class="datatable">
      <tr>
        <th>Mã số</th>
        <th>Tên NXB</th>
        <th>Địa chỉ NXB</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let publisher of publishers">
        <td class="fw-normal mb-1">
          <p>{{publisher.publisherId}}</p>
        </td>
        <td>
          <p class="fw-normal mb-1">{{publisher.publisherName}}</p>
        </td>
        <td>
          <p class="fw-normal mb-1">{{publisher.publisherAddress}}</p>
        </td>
        <td>
            <div class="d-flex">
                <button type="button" class="btn btn-warning me-2" data-bs-toggle="modal" data-bs-target="#updateModal"
                    (click)="handleUpdate(publisher)"><i class="fas fa-edit"></i> Sửa</button>
                <button type="button" class="btn btn-danger" (click)="handleDelete(publisher.publisherId!)"> <i
                        class="fas fa-trash-alt"></i> Xóa</button>
            </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<nav class="float-end mt-2" aria-label="...">
  <ul class="pagination mt-3">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a href="#" class="page-link" (click)="setPage(currentPage - 1); $event.preventDefault()">Previous</a>
    </li>

    <li class="page-item" [class.disabled]="isLastPage">
      <a href="#" class="page-link" (click)="setPage(currentPage + 1); $event.preventDefault()">Next</a>
    </li>
  </ul>

<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Thêm tác giả</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form #createForm ="ngForm" (ngSubmit)="onSubmit(createForm)">
          <label for="firstName">Tên NXB:</label>
          <input class="form-control" placeholder="Nhập tên của NXB...." type="text" name="publisherName" id="publisherName" ngModel/>
          <br>
          <label for="lastName">Địa chỉ NXB:</label>
          <input type="text"  name="publisherAddress" placeholder="Nhập địa chỉ của NXB...." id="publisherAddress" class="form-control" ngModel>
        <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        <button type="submit" class="btn btn-primary">Thêm</button>
      </div>
    </form> 
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="updateModal" tabindex="-1"  *ngIf="updatePublisher" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Thêm tác giả</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <label for="publisherName">Họ:</label>
          <input class="form-control" placeholder="Nhập tên của NXB..." type="text" name="publisherName" id="publisherName" [(ngModel)]="updatePublisher.publisherName"/>
          <br>
          <label for="publisherAddress">Tên:</label>
          <input type="text" name="publisherAddress" placeholder="Nhập địa chỉ của NXB...." id="publisherAddress" class="form-control"  [(ngModel)]="updatePublisher.publisherAddress">
      </div> 
      <div class="modal-footer">
        <button type="button" #closeBtn class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        <button type="button" class="btn btn-primary" (click)="update()">Lưu</button>
      </div>
    </div>
  </div>
</div>
</nav>
