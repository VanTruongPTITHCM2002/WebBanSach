<div class="sidebar d-flex flex-column overflow-auto" [class.collapsed] = "isCollapsed">

   <button class="btn btn-light toggle-btn" (click)="toggleSidebar()">
   <i class="fas {{ isCollapsed ? 'fa-arrow-right' : 'fa-arrow-left' }}"></i>
  </button>
  <!-- Logo Header -->
  <h4 class="text-white text-center mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-book" viewBox="0 0 16 16">
      <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
    </svg>
    Quản lý sách
  </h4>

  <!-- Navigation Links -->
  <a routerLink="dashboard" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <i class="fas fa-home"></i>
    <span>Trang chủ</span>
  </a>

  <!-- Products Dropdown -->
  <div class="dropdown">
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="collapse" data-bs-target="#productMenu" aria-expanded="false" role="button">
      <span>
        <i class="fas fa-box"></i>
        <span>Sản phẩm</span>
      </span>
    </a>
    <div id="productMenu" class="collapse ps-2">
      <a class="nav-link" routerLink="books" routerLinkActive="active">
        <i class="fas fa-book"></i>
        <span>Sách</span>
      </a>
      <a class="nav-link" routerLink="categories" routerLinkActive="active">
        <i class="fas fa-list"></i>
        <span>Danh mục</span>
      </a>
    </div>
  </div>

  <!-- Other Navigation Items -->
  <a routerLink="authors" class="nav-link" routerLinkActive="active">
    <i class="fas fa-user-tie"></i>
    <span>Tác giả</span>
  </a>

  <a routerLink="publishers" class="nav-link" routerLinkActive="active">
    <i class="fas fa-newspaper"></i>
    <span>Nhà xuất bản</span>
  </a>

  <a routerLink="orders" class="nav-link" routerLinkActive="active">
    <i class="fas fa-clipboard-list"></i>
    <span>Đơn hàng</span>
  </a>

  <a routerLink="invoices" class="nav-link" routerLinkActive="active">
    <i class="fas fa-receipt"></i>
    <span>Hóa đơn</span>
  </a>

  <a routerLink="/users" class="nav-link" routerLinkActive="active">
    <i class="fas fa-users"></i>
    <span>Người dùng</span>
  </a>

  <!-- Logout Button -->
  <a (click)="logOut()" class="nav-link" role="button">
    <i class="fas fa-sign-out-alt"></i>
    <span>Đăng xuất</span>
  </a>
</div>
