<form (ngSubmit)="onSubmit(myForm)" class="form py-5" #myForm="ngForm">
    <h3 class="title">Đăng nhập</h3>
    <div class="form-group">
      <label class="fs-6"
      [ngClass]="username.invalid && username.touched ?  'text-danger' : ''"
      >Tên tài khoản
        <span class="text-danger">*</span>
      </label>
      <input
        type="text"
        class="form-control"
        placeholder="Nhập tên tài khoản...."
        id="exampleInputEmail1"
        name="username"
        ngModel
        required
        #username="ngModel"
        autocomplete="username"
      />
      <div class="invalid-feedback"
      
      *ngIf="isSubmit && username.hasError('required')">
        Vui lòng nhập tên tài khoản.
      </div>
    </div>

    <div class="form-group">
      <label class="fs-6">Mật khẩu
        <span class="text-danger">*</span>
      </label>
      <input
        type="password"
        class="form-control"
        id="exampleInputPassword1"
        placeholder="Nhập mật khẩu..."
        name="password"
        ngModel
        required
        minlength="1"
        #password="ngModel"
        autocomplete="current-password"
      />
      <div class="invalid-feedback" *ngIf="isSubmit && password.hasError('required')">
        Vui lòng nhập mật khẩu.
      </div>
    </div>
    
   
    <div class="form-group form-check form-option">
      <div>
        <input type="checkbox" class="form-check-input" id="exampleCheck1" name="check" ngModel />
        <label class="form-check-label" for="exampleCheck1">Lưu thông tin đăng nhập</label>
      </div>
      <a class="register-link" (click)="onToggleMode()">Đăng ký tài khoản</a>
    </div>

    <div class="btn-login">
      <button class="btn btn-warning" type="submit"
      >Đăng nhập</button>
    </div>
</form>
