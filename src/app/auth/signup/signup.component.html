
<form (ngSubmit)="onSubmitRegister(myForm)" class="form row g-3" #myForm="ngForm" [ngStyle]="{'margin-top': isRegisterMode ? '100px' : '100px'}">
  <h3 class="title">Đăng ký</h3>
  <div class="form-group">
    <label class="fs-6">Tên tài khoản
      <span class="text-danger">*</span>
    </label>
    <input
      type="text"
      class="form-control"
      placeholder="Nhập tên tài khoản...."
      id="registerUsername"
      name="username"
      ngModel
      required
      #username="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && username.hasError('required')">
      Vui lòng nhập tên tài khoản.
    </div>
  </div>

  <div class="form-group">
    <label class="fs-6">Mật khẩu
      <span class="text-danger">*</span>
      </label>
    <input
      type="password"
      class="form-control"
      id="registerPassword"
      placeholder="Nhập mật khẩu..."
      name="password"
      ngModel
      required
      minlength="6"
      #password="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && password.hasError('required')">
      Vui lòng nhập mật khẩu.
    </div>
  </div>

  <div class="form-group">
    <label class="fs-6">Nhập lại mật khẩu
      <span class="text-danger">*</span>
      </label>
    <input
      type="password"
      class="form-control"
      id="registerRePassword"
      placeholder="Nhập lại mật khẩu..."
      name="repassword"
      ngModel
      required
      minlength="6"
      #password="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && password.hasError('required')">
      Vui lòng nhập mật khẩu.
    </div>
  </div>

  <div class="btn-login">
    <button type="submit" (click)="onRegisterMode(myForm)" class="btn btn-primary">Đăng ký</button>
  </div>

  <div class="form-group form-check form-option">
    <a class="login-link" (click)="onToggleMode()">Đã có tài khoản? Đăng nhập</a>
  </div>
</form>
