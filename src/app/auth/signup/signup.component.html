
<form (ngSubmit)="onSubmitRegister(myForm)" class="form row g-3" #myForm="ngForm" [ngStyle]="{'margin-top': isRegisterMode ? '100px' : '100px'}">
  <h3 class="title">Đăng ký</h3>
  <div class="form-group" *ngIf="!isRegisterMode">
    <input
      type="text"
      class="form-control"
      placeholder="Nhập tên tài khoản...."
      id="registerUsername"
      name="username"
      ngModel
      required
      #username="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && username.hasError('required')">
      Vui lòng nhập tên tài khoản.
    </div>
  </div>

  <div class="form-group" *ngIf="!isRegisterMode">
    <input
      type="password"
      class="form-control"
      id="registerPassword"
      placeholder="Nhập mật khẩu..."
      name="password"
      ngModel
      required
      minlength="1"
      #password="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && password.hasError('required')">
      Vui lòng nhập mật khẩu.
    </div>
  </div>

  <div class="form-group" *ngIf="!isRegisterMode">
    <input
      type="password"
      class="form-control"
      id="registerRePassword"
      placeholder="Nhập lại mật khẩu..."
      name="repassword"
      ngModel
      required
      minlength="1"
      #password="ngModel"
    />
    <div class="invalid-feedback" *ngIf="isContinue && password.hasError('required')">
      Vui lòng nhập mật khẩu.
    </div>
  </div>


  <div class="register" *ngIf="isRegisterMode">
 <div class="form-group col-md-12 gap-2">
      <input
        type="text"
        class="form-control"
        id="firstname"
        placeholder="Nhập tên..."
        name="firstname"
        ngModel
        required
        #firstname="ngModel"
      />
    </div>

    <div class="form-group col-md-12">
      <input
        type="text"
        class="form-control"
        id="lastname"
        placeholder="Nhập họ..."
        name="lastname"
        ngModel
        required
        #lastname="ngModel"
      />
    </div>

    <div class="form-group col-md-12">
      <input
        type="email"
        class="form-control"
        id="registerEmail"
        placeholder="Nhập email..."
        name="email"
        ngModel
        required
        #email="ngModel"
      />
    </div>

    <div class="form-group col-md-12">
      <input
        type="text"
        class="form-control"
        id="address"
        placeholder="Nhập địa chỉ..."
        name="address"
        ngModel
        required
        #address="ngModel"
      />
    </div>

    <div class="form-group col-md-12">
      <input
        type="tel"
        class="form-control"
        id="phone"
        placeholder="Nhập số điện thoại..."
        name="phone"
        ngModel
        required
        #phone="ngModel"
      />
    </div>
  </div>

  <div class="btn-login">
    <button type="submit" *ngIf="!isRegisterMode" (click)="onRegisterMode(myForm)" class="btn btn-primary">Tiếp tục</button>
    <button type="submit" *ngIf="isRegisterMode" (click)="onRegisterMode(myForm)" class="btn btn-primary">Đăng ký</button>
  </div>

  <div class="form-group form-check form-option">
    <a class="login-link" (click)="onToggleMode()">Đã có tài khoản? Đăng nhập</a>
  </div>
</form>
