<div class="root-container">
    <div class="main-container mt-3 d-flex overflow-hidden">
  
      <div class="container-list w-25 ms-3 border-2">
        <h3 class="title-list">Danh mục sản phẩm</h3>
        <sub-detail [publishers]="publishers" [(selectedPublisher)]="selectedPublisher" 
        [(selectedPrice)]="selectedPrice"
        (sortChange)="handleSort()"></sub-detail>
      </div>
  
      <div class="container-image flex-grow-1 ms-3">
            <h5>{{getNameCategory()}}</h5>
            <div class="line-divide"></div>

            <div class="group-filter-book">
                <h6>Sắp xếp</h6>

                <select name="filterPrice" (change)="handleSort()" [(ngModel)]="sort" title="Lọc sách theo giá và mới nhất">
                        <option value="new">Mới nhất</option>
                        <option value="min">Giá từ thấp đến cao</option>
                        <option value="max">Giá từ cao đến thấp</option>
                </select>

                <select name="filterQuantity" (change)="handleFilter()" [(ngModel)]="size" title="Lọc sách theo số lượng" >
                        <option [value]="5">5 sản phẩm</option>
                        <option [value]="10" selected>10 sản phẩm</option>
                        <option [value]="20">20 sản phẩm</option>
                        <option [value]="50">50 sản phẩm</option>
                        <option [value]="100">100 sản phẩm</option>
                </select>
            </div>

            <div class="container h-100 d-flex justify-content-between flex-column">
              <div class="d-flex flex-wrap gap-3 p-4 justify-content-start align-items-center overflow-auto">

                <div *ngIf="books.length > 0 ; else notFound" class="d-flex gap-5 flex-wrap">
                  <div class="card card-responsive min-h-350" *ngFor="let book of books" [routerLink]="['/book', book.bookid]"
                    [state]="{title: book.title}">
                
                    <img [src]="book.link || 'placeholder-image.svg'" class="img-fluid img-fixed p-3 min-h-260 shadow-sm" alt="...">
                    <div class="card-body">
                      <h5 class="card-text">{{ book.title }} </h5>
                      <span class="d-flex justify-content-between items-center">
                        <p>{{book.authorName}}</p>
                        <p class="card-text fs-5">{{book.price | currency: 'VND'}}</p>
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <ng-template #notFound>
                  <div class="alert alert-light text-center shadow-sm">
                    <i class="fs-1"></i>
                    <div class="fw-semibold mt-2">No books available</div>
                  </div>
              </ng-template>

                <nav class="mb-5 d-flex justify-content-center" *ngIf="books.length > 0" aria-label="Page navigation example">
                  <ul class="pagination mb-0">
                
                    <!-- First -->
                    <li class="page-item" [class.disabled]="currentPage === 1">
                      <a href="#" class="page-link" (click)="setPage(1); $event.preventDefault()">
                        <i class="fas fa-angle-double-left me-1"></i>
                        Đầu
                      </a>
                    </li>
                
                    <!-- Previous -->
                    <li class="page-item" [class.disabled]="currentPage === 1">
                      <a href="#" class="page-link" (click)="setPage(currentPage - 1); $event.preventDefault()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Trước
                      </a>
                    </li>
                
                    <!-- Current page -->
                    <li class="page-item active">
                      <span class="page-link">
                        Trang {{ currentPage }} / {{ totalPages }}
                      </span>
                    </li>
                
                    <!-- Next -->
                    <li class="page-item" [class.disabled]="currentPage === totalPages">
                      <a href="#" class="page-link" (click)="setPage(currentPage + 1); $event.preventDefault()">
                        Sau
                        <i class="fas fa-chevron-right ms-1"></i>
                      </a>
                    </li>
                
                    <!-- Last -->
                    <li class="page-item" [class.disabled]="currentPage === totalPages">
                      <a href="#" class="page-link" (click)="setPage(totalPages); $event.preventDefault()">
                        Cuối
                        <i class="fas fa-angle-double-right ms-1"></i>
                      </a>
                    </li>
                
                  </ul>
                </nav>

                
            </div>
    </div>
    
  </div>
