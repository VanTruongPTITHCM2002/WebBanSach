<nav class="navbar-container">
    <nav class="navbar bg-warning navbar-container-son">
      <ul class="navbar-nav d-flex flex-row justify-content-between align-items-center w-100 ms-3">
        <li class="nav-item flex-grow-1">
          <a class="nav-link" routerLink="/">
            <img width="100" height="70" src="/icons8-bookstore-66.png" alt="Trang chủ">
          </a>
        </li>
        <li class="nav-item flex-grow-1 mt-3 mx-2">
          <div class="input-group mb-3">
            <input [(ngModel)] = "txtSearch" type="text" class="form-control" placeholder="Tìm kiếm..." aria-label="Recipient's username"
            aria-describedby="button-addon2">
            <button (click)="searchValue(txtSearch)" class="btn btn-outline-secondary" type="button" id="button-addon2">
                <i class="bi bi-search"> Tìm kiếm </i>
            </button>
          </div>
        </li>

        <li class="nav-item">
          <div class="dropdown">
            <button class="btn btn-warning" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bell"></i>
              Thông báo
            </button>
          
            <ul class="dropdown-menu">
              <!-- <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><a class="dropdown-item" href="#">Something else here</a></li> -->
              <li>Không có thông báo</li>
            </ul>
          </div>
        </li>

        <li class="nav-item">
          <button type="button" class="btn btn-warning" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling">
            <i class="bi bi-cart"></i>
            Giỏ hàng
          </button>

           <div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Giỏ hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <div *ngIf="authService.isAuthenticated">
              <ul *ngFor="let item of cart?.cartItems; let i = index" class="list-unstyled">
                <li class="row mb-4 d-flex justify-content-between align-items-center">
                  <hr class="my-4">
                  <div class="col-md-2 col-lg-2 col-xl-2">
                        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-shopping-carts/img5.webp" class="img-fluid rounded-3" alt="Cotton T-shirt">
                  </div>
                  <div class="col-md-3 col-lg-3 col-xl-3">
                        <h6 class="text-muted"> {{ item.title }}</h6>
                        <!-- <h6 class="mb-0">Cotton T-shirt</h6> -->
                      </div>

                  <div class="col-md-3 col-lg-3 col-xl-3 d-flex">
                            <input id="quantity" title="quantity" min="0" name="quantity" [(ngModel)]="item.quantity" (ngModelChange)="updateTotal()" type="number" class="form-control">
                      </div>

                      <div class="col-md-3 col-lg-2 col-xl-2 offset-lg-1 ms-2">
                        <h6 class="mb-0">{{ item.price | currency: 'VND' }}</h6>
                      </div>
                  
                      <div class="col-md-1 col-lg-1 col-xl-1 text-end">
                        <a title="deleteItem" href="#!" class="text-muted"><i class="fa fa-times" aria-hidden="true"></i></a>
                      </div>
                </li>
              </ul>
              <p class="float-end">Tổng tiền: {{total | currency: 'VND'}} </p>
            </div> 
            <p *ngIf="!authService.isAuthenticated">Vui lòng đăng nhập</p>
          </div>
        </div>



        <li class="nav-item">
          <img *ngIf="authService.isAuthenticated" src="/icons8-avatar-48.png" class="avatar dropdown-toggle"
            alt="ảnh đại diện" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">

          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton1">
            <li><a class="dropdown-item" href="#">Quản lý tài khoản</a></li>
            <li><a class="dropdown-item" href="#">Cài đặt</a></li>
            <li><a class="dropdown-item" href="#" (click)="logout()">Đăng xuất</a></li>
          </ul>
          
          <a *ngIf="!authService.isAuthenticated" class="nav-link btn btn-warning" routerLink="/auth/login"
          (click) = "isClickFormLogin()"
          >
            <i class="bi bi-person-fill"></i>
            Đăng nhập
          </a>
        </li>
      </ul>
    </nav>
  </nav>
