<div class="root-container">
  <div class="main-container mt-3 d-flex overflow-hidden">

    <div class="container-list w-25 ms-3 border-2">
      <h2 class="title-list">Danh mục sản phẩm</h2>
      <ul class="list-group btn-group dropend list-book" *ngFor="let c of category">
        <li class="list-group-item fs-5" [routerLink]="['/category',c.categoryId]">{{c.categoryName}}</li>
      </ul>
    </div>

    <div class="container-image flex-grow-1 ms-3">
      <img width="950" height="400" src="/your-own-library-landing-page-template_151150-680.jpg" alt="" srcset="">
    </div>
  </div>

  <h2 class="title-new-book">Các sản phẩm sách bán chạy</h2>
  <div class="container m-sm-0 me-lg-0">
    <div class="d-flex flex-nowrap gap-3  justify-content-start align-items-center">
        <div class="card card-sub" *ngFor="let b of book">
          <div class="card-body" routerLink="/book">  
            <img src="{{b.link}}" width="130" height="200" class="card-img-top" alt="Ảnh">
            <h5 class="card-title text-nowrap">{{b.title}}</h5>
            <p class="card-text">This is a longer card with supporting text</p>
          </div>
        </div>
    </div>
  </div>

  <h2 class="title-new-book">Các sản phẩm sách được đánh giá cao</h2>
  <div class="container m-sm-0 me-lg-0" >
    <div class="d-flex flex-nowrap gap-3  justify-content-start align-items-center">
        <div class="card card-sub" *ngFor="let b of book">
          <div class="card-body" routerLink="/book">  
            <img src="{{b.link}}" width="130" height="200" class="card-img-top" alt="Ảnh">
            <h5 class="card-title text-nowrap">{{b.title}}</h5>
            <p class="card-text">This is a longer card with supporting text</p>
          </div>
        </div>
    </div>
  </div>

</div>
